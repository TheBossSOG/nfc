<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>Photo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #0a0a0a;
    overflow: hidden;
    font-family: -apple-system, "Segoe UI", "Noto Sans Thai", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .track {
    display: flex;
    height: 100%;
    transition: transform 0.3s ease;
    touch-action: pan-y;
  }
  .slide {
    min-width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .slide img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
  }
  .dots {
    position: fixed;
    left: 0; right: 0;
    bottom: calc(16px + env(safe-area-inset-bottom));
    display: flex;
    gap: 8px;
    justify-content: center;
    pointer-events: none;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
    transition: background 0.2s;
  }
  .dot.on { background: #fff; }
  .caption {
    position: fixed;
    left: 0; right: 0;
    top: calc(14px + env(safe-area-inset-top));
    text-align: center;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    text-shadow: 0 1px 6px rgba(0,0,0,0.6);
    pointer-events: none;
    padding: 0 16px;
  }
  .msg {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #777; font-size: 15px; text-align: center;
    padding: 24px; line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="caption" id="caption"></div>
  <div class="track" id="track"></div>
  <div class="dots" id="dots"></div>
  <div class="msg" id="msg" style="display:none"></div>

<script>
  // ===== อ่านค่าจากลิงก์ =====
  // ตัวอย่าง: index.html?img=john1.jpg,john2.jpg&name=คุณจอห์น
  var params = new URLSearchParams(location.search);
  var imgParam = params.get('img') || params.get('p') || '';
  var name = params.get('name') || params.get('text') || '';
  var FOLDER = 'img/'; // รูปทั้งหมดเก็บในโฟลเดอร์ img/

  var track = document.getElementById('track');
  var dotsBox = document.getElementById('dots');
  var msg = document.getElementById('msg');
  var caption = document.getElementById('caption');

  var files = imgParam.split(',').map(function (s) { return s.trim(); }).filter(Boolean);

  if (files.length === 0) {
    msg.style.display = 'flex';
    msg.innerHTML = 'ยังไม่ได้ระบุรูปในลิงก์<br>ตัวอย่าง: <b>?img=ชื่อรูป.jpg</b>';
  } else {
    if (name) caption.textContent = name;

    files.forEach(function (f) {
      var slide = document.createElement('div');
      slide.className = 'slide';
      var im = document.createElement('img');
      im.src = FOLDER + f;
      im.alt = f;
      im.onerror = function () { slide.innerHTML = '<div style="color:#777;font-size:14px;text-align:center;padding:24px">ไม่พบไฟล์<br>' + FOLDER + f + '</div>'; };
      slide.appendChild(im);
      track.appendChild(slide);
    });

    // จุดบอกจำนวนรูป (แสดงเมื่อมีมากกว่า 1 รูป)
    if (files.length > 1) {
      files.forEach(function (_, i) {
        var d = document.createElement('div');
        d.className = 'dot' + (i === 0 ? ' on' : '');
        dotsBox.appendChild(d);
      });
    }

    // ===== ปัดซ้าย/ขวา =====
    var idx = 0, startX = 0, dragging = false;
    function go(n) {
      idx = Math.max(0, Math.min(files.length - 1, n));
      track.style.transform = 'translateX(' + (-idx * 100) + '%)';
      var dots = dotsBox.children;
      for (var i = 0; i < dots.length; i++) dots[i].className = 'dot' + (i === idx ? ' on' : '');
    }
    track.addEventListener('touchstart', function (e) { startX = e.touches[0].clientX; dragging = true; }, { passive: true });
    track.addEventListener('touchend', function (e) {
      if (!dragging) return; dragging = false;
      var dx = e.changedTouches[0].clientX - startX;
      if (dx < -50) go(idx + 1);
      else if (dx > 50) go(idx - 1);
    }, { passive: true });
    // รองรับเมาส์บนคอมด้วย
    track.addEventListener('mousedown', function (e) { startX = e.clientX; dragging = true; });
    window.addEventListener('mouseup', function (e) {
      if (!dragging) return; dragging = false;
      var dx = e.clientX - startX;
      if (dx < -50) go(idx + 1); else if (dx > 50) go(idx - 1);
    });
  }
</script>
</body>
</html>
